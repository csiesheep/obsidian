<script data-sn-ga>(function () {
  var RATE = 0.3; // 自動イベント（config）を送るブラウザの割合
  var EVENT_RATE = 0.15; // ゲームのイベントも送るブラウザの割合（RATE 以下。同じ乱数なので RATE の人の一部）
  var DROP = ['cut', 'place', 'stage_try', 'again', 'stage_wrong', 'loop_judge'];
  var w = typeof window !== 'undefined' ? window : globalThis;

  function bucket() {
    try {
      var v = w.localStorage.getItem('sn_ga_b');
      var n = v == null ? NaN : Number(v);
      if (!(n >= 0 && n < 1)) { n = Math.random(); w.localStorage.setItem('sn_ga_b', String(n)); }
      return n;
    } catch (e) { return Math.random(); }
  }
  var b = bucket();
  var on = b < RATE;
  var events = b < EVENT_RATE;

  var mem = {};
  function first(key) {
    try {
      var o = JSON.parse(w.sessionStorage.getItem('sn_ga_once') || '{}') || {};
      if (o[key]) return false;
      o[key] = 1;
      w.sessionStorage.setItem('sn_ga_once', JSON.stringify(o));
      return true;
    } catch (e) {
      if (mem[key]) return false;
      mem[key] = 1;
      return true;
    }
  }

  function allow(args) {
    if (!on) return false;
    if (args[0] !== 'event') return true; // js / config / set
    if (!events) return false;
    var name = String(args[1]);
    if (DROP.indexOf(name) >= 0) return false;
    var p = args[2] || {};
    var game = p.game != null ? String(p.game) : String((w.location && w.location.pathname) || '/').split('/')[1] || '';
    return first(name + '|' + game);
  }

  var inner = null;
  function gated() { if (inner && allow(arguments)) return inner.apply(this, arguments); }
  try {
    Object.defineProperty(w, 'gtag', {
      configurable: true,
      enumerable: true,
      get: function () { return inner ? gated : undefined; },
      set: function (f) { inner = typeof f === 'function' ? f : null; },
    });
  } catch (e) { /* 包めなければ従来どおり */ }
  w.__snGa = { on: on, events: events, rate: RATE, eventRate: EVENT_RATE, drop: DROP.slice() };
})();</script>

<script type="module">
// What this browser has not played today first (common/played.js), with a small label.
import { ranked, returning, badge } from '/common/played.js';
import { playClips } from '/common/clips.js';
const main = document.querySelector('.games');
const ret = returning(null);
for (const g of ranked(null, { quiet: true })) {
  const a = main.querySelector(`[data-slug="${g.slug}"]`);
  if (!a) continue;
  const b = badge(g, ret);
  if (b) a.querySelector('.marks').insertAdjacentHTML('beforeend', `<em>${b}</em>`);
  a.dataset.why = g.why;
  main.append(a);
}
playClips(main);
document.querySelector('.nazo-link').addEventListener('click', () => globalThis.gtag?.('event', 'more_click', { to: 'nazo', placement: 'hub' }));
main.addEventListener('click', (e) => {
  const a = e.target.closest('[data-slug]');
  if (a) globalThis.gtag?.('event', 'more_click', { to: a.dataset.slug, placement: 'hub', why: a.dataset.why });
});
</script>
