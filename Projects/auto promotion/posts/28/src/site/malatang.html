  let flowSnd = null; // 注ぐ音(じょろじょろ): 毎フレーム大きさを決める
  const flowSound = (v, f) => { if (!ac) return; if (!flowSnd) { const s = ac.createBufferSource(), bf = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = nbuf(); s.loop = true; bf.type = "bandpass"; bf.Q.value = 0.9; g.gain.value = 0; s.connect(bf).connect(g).connect(ac.destination); s.start(); flowSnd = { g, bf }; } flowSnd.g.gain.setTargetAtTime(v, ac.currentTime, 0.05); if (f) flowSnd.bf.frequency.setTargetAtTime(f, ac.currentTime, 0.05); };
  const plop = () => { tone(rnd(300, 420), 0.09, "sine", 0.12); tone(rnd(160, 220), 0.12, "triangle", 0.06, 0.02); };

  // ---------- 具(1回タップ = 1つかみ・重さg) ----------

  const box = $("stageBox"), cv = document.createElement("canvas"); box.appendChild(cv);
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.outputEncoding = THREE.sRGBEncoding; renderer.shadowMap.enabled = true;

  // テーブル
