  // 時間限定(日本時間 0:00〜3:00 と 12:00〜13:00)のゲームは、時間外なら「あと何時間」を出す
  function nightLabel() {
    const j = new Date(Date.now() + 9 * 3600e3), h = j.getUTCHours(), m = j.getUTCMinutes();
    for (const el of document.querySelectorAll('.play[data-night]')) {
      if (h < 3) { el.textContent = "▶ あそぶ（3時まで）"; el.style.background = ""; }
      else if (h === 12) { el.textContent = "▶ あそぶ（昼の特別公開・13時まで）"; el.style.background = ""; }
      else { const nh = h < 12 ? 12 : 24, left = (nh - h) * 60 - m, hh = Math.floor(left / 60), mm = left % 60; el.textContent = `${h < 12 ? "☀️ 昼12時" : "🌙 深夜0時"}に開く（あと${hh ? hh + "時間" : ""}${mm}分）`; el.style.background = "#222"; }
    }
  }
  nightLabel(); setInterval(nightLabel, 30000);
  // 次回作の予告カード
  const soon = document.createElement("a");
  soon.className = "card soon"; soon.href = "https://x.com/piko2_p"; soon.target = "_blank"; soon.rel = "noopener";
  soon.innerHTML = `
    <div class="thumb">🔨</div>
    <div class="body">
      <h3>次のゲーム、作ってます…</h3>
      <p>新作ができたらXでお知らせするよ。フォローして待っててね！</p>
      <span class="play">𝕏 フォローする</span>
    </div>`;
  grid.appendChild(soon);

  // 「今◯人が遊んでる」
  async function refreshOnline() {
    for (const el of document.querySelectorAll(".live[data-online]")) {
      const url = el.dataset.online; if (!url) continue;
      try {
        const r = await fetch(url, { cache: "no-store" });
        const { n } = await r.json();
        el.style.display = n > 0 ? "inline-flex" : "none";
        el.lastElementChild.textContent = `${n}人が遊んでる`;
      } catch {}
    }
  }
  refreshOnline();
  setInterval(() => { if (!document.hidden) refreshOnline(); }, 60000); // 見ていない(裏タブ)間は聞かない
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshOnline(); });

  // 「◯回あそばれた」(ページが開かれた回数。同じ人は1日1回まで)
  // サーバーの記録係が入れかわる一瞬は失敗することがあるので、少し待って何回かやり直す
  (function loadVisits(tries) {
    fetch("/api/visits?m=" + Math.floor(Date.now() / 60000) + "&t=" + tries, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((c) => {
      for (const el of document.querySelectorAll(".played[data-slug]")) {
        const n = c[el.dataset.slug];
        if (typeof n === "number" && n > 0) el.textContent = `👀 ${n.toLocaleString()}回あそばれた`;
      }
    }).catch(() => { if (tries < 5) setTimeout(() => loadVisits(tries + 1), 1200 * (tries + 1)); });
  })(0);
</script>
