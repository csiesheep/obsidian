<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Comic Sans MS','Chalkboard SE','Microsoft JhengHei','PingFang TC','Segoe UI',sans-serif">
  <defs>
    <filter id="rough">
      <feTurbulence type="turbulence" baseFrequency="0.017" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="1200" height="630" fill="#f4ecd8"/>

  <!-- ============ DOODLE INK (wobbly) ============ -->
  <g filter="url(#rough)" fill="none" stroke="#33302b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- hand-drawn double frame -->
    <rect x="22" y="22" width="1156" height="586" rx="18"/>
    <rect x="30" y="30" width="1140" height="570" rx="16" stroke-width="2"/>

    <!-- coffee ring (diary vibe) -->
    <circle cx="1085" cy="86" r="26" stroke="#b98a4a" stroke-width="3" opacity="0.4"/>

    <!-- table shadow -->
    <ellipse cx="600" cy="372" rx="342" ry="132" fill="#000000" opacity="0.10" stroke="none"/>
    <!-- table -->
    <ellipse cx="600" cy="358" rx="342" ry="132" fill="#e6d0a3"/>
    <!-- house tiles + dice scattered on table -->
    <rect x="520" y="330" width="60" height="60" rx="4" fill="#d8c096" transform="rotate(-8 550 360)"/>
    <rect x="600" y="352" width="58" height="58" rx="4" fill="#d8c096" transform="rotate(6 629 381)"/>
    <rect x="560" y="300" width="54" height="54" rx="4" fill="#d8c096" transform="rotate(4 587 327)"/>
    <rect x="690" y="330" width="34" height="34" rx="6" fill="#fbfaf6" transform="rotate(12 707 347)"/>
    <rect x="470" y="360" width="30" height="30" rx="6" fill="#fbfaf6" transform="rotate(-10 485 375)"/>

    <!-- ===== SHEEP (小羊 = 你), left, chill ===== -->
    <!-- fluff top -->
    <path d="M176,338 a15,15 0 0 1 30,0 a15,15 0 0 1 30,0 a15,15 0 0 1 30,0 a15,15 0 0 1 30,0" fill="#fbfaf6"/>
    <ellipse cx="250" cy="372" rx="80" ry="52" fill="#fbfaf6"/>
    <!-- legs -->
    <path d="M212,420 v28 M244,424 v28 M276,424 v28 M304,420 v26"/>
    <!-- head -->
    <ellipse cx="322" cy="360" rx="28" ry="24" fill="#3a3430"/>
    <ellipse cx="300" cy="344" rx="11" ry="7" fill="#3a3430" transform="rotate(-30 300 344)"/>
    <ellipse cx="346" cy="346" rx="11" ry="7" fill="#3a3430" transform="rotate(30 346 346)"/>
    <!-- arm to sound board -->
    <path d="M330,392 q26,10 44,4"/>
    <!-- sound board device -->
    <rect x="382" y="386" width="56" height="36" rx="7" fill="#33302b"/>
    <!-- sound waves -->
    <path d="M446,392 q10,12 0,24 M456,384 q18,20 0,40 M466,376 q26,28 0,56" stroke-width="3"/>

    <!-- ===== BACK friend (far side), just a head + panic ===== -->
    <circle cx="640" cy="212" r="22" fill="#e9c9a2"/>

    <!-- ===== FRONT friend, shocked, near side ===== -->
    <circle cx="452" cy="470" r="28" fill="#e9c9a2"/>
    <!-- arms up -->
    <path d="M430,486 q-24,-6 -34,-26 M474,486 q24,-6 34,-26"/>
    <!-- knocked cup + spill -->
    <path d="M540,486 l30,8 l-8,30 l-30,-8 z" fill="#fbfaf6" transform="rotate(24 555 500)"/>
    <path d="M540,516 q16,14 40,10" stroke="#c0392b" stroke-width="3"/>

    <!-- ===== TRAITOR (right), flipping face ===== -->
    <!-- red aura burst -->
    <path d="M1010,285 l16,-46 l10,44 l40,-24 l-26,40 l48,4 l-46,18 l34,34 l-46,-16 l6,48 l-30,-38 l-30,38 l6,-48 l-46,16 l34,-34 l-46,-18 l48,-4 l-26,-40 l40,24 l10,-44 z" fill="#c0392b" opacity="0.20" stroke="none"/>
    <!-- cloak -->
    <path d="M966,478 Q972,332 1010,322 Q1048,332 1054,478 Z" fill="#35302b"/>
    <!-- horns -->
    <path d="M992,246 L982,214 L1004,242 Z" fill="#35302b"/>
    <path d="M1028,246 L1038,214 L1016,242 Z" fill="#35302b"/>
    <!-- head -->
    <circle cx="1010" cy="272" r="32" fill="#e9c9a2"/>
    <!-- grin -->
    <path d="M990,282 Q1010,304 1030,282 Z" fill="#fbfaf6"/>
    <path d="M1000,286 v10 M1010,289 v11 M1020,286 v10" stroke-width="2"/>
    <!-- raised arm + flipped card -->
    <path d="M1046,360 q22,-6 34,-30"/>
    <g transform="rotate(18 1092 300)">
      <rect x="1072" y="276" width="42" height="56" rx="5" fill="#c0392b"/>
      <circle cx="1093" cy="298" r="11" fill="#fbfaf6"/>
      <circle cx="1089" cy="296" r="2.5" fill="#33302b" stroke="none"/>
      <circle cx="1097" cy="296" r="2.5" fill="#33302b" stroke="none"/>
      <path d="M1088,308 h10" stroke-width="2"/>
    </g>

    <!-- ===== musical notes drifting across the table ===== -->
    <g stroke-width="3">
      <path d="M494,352 v-30 M560,330 v-30 M628,344 v-30"/>
    </g>
  </g>

  <!-- filled note heads (wobble lightly) -->
  <g filter="url(#rough2)" stroke="none">
    <ellipse cx="489" cy="353" rx="8" ry="6" fill="#33302b" transform="rotate(-20 489 353)"/>
    <ellipse cx="555" cy="331" rx="8" ry="6" fill="#33302b" transform="rotate(-20 555 331)"/>
    <ellipse cx="623" cy="345" rx="8" ry="6" fill="#33302b" transform="rotate(-20 623 345)"/>
  </g>

  <!-- ============ SPEECH BUBBLES ============ -->
  <g filter="url(#rough2)">
    <!-- sheep bubble -->
    <path d="M150,205 h180 a14,14 0 0 1 14,14 v40 a14,14 0 0 1 -14,14 h-40 l-14,20 l-4,-20 h-122 a14,14 0 0 1 -14,-14 v-40 a14,14 0 0 1 14,-14 z" fill="#fbfaf6" stroke="#33302b" stroke-width="3"/>
    <!-- traitor jagged bubble -->
    <path d="M812,120 l190,-8 l14,20 l22,-10 l-8,26 l20,10 l-22,14 l6,22 l-208,6 z" fill="#fbfaf6" stroke="#33302b" stroke-width="3"/>
    <path d="M905,192 l18,34 l-40,-24 z" fill="#fbfaf6" stroke="#33302b" stroke-width="3"/>
  </g>

  <!-- ============ CRISP TEXT + faces ============ -->
  <g>
    <!-- sheep eyes -->
    <circle cx="314" cy="357" r="4" fill="#fbfaf6"/>
    <circle cx="332" cy="357" r="4" fill="#fbfaf6"/>
    <circle cx="315" cy="358" r="1.6" fill="#111"/>
    <circle cx="333" cy="358" r="1.6" fill="#111"/>
    <!-- traitor eyes (red, angry) -->
    <path d="M994,266 l14,6 M1026,266 l-14,6" stroke="#33302b" stroke-width="3" fill="none"/>
    <circle cx="1002" cy="272" r="4" fill="#c0392b"/>
    <circle cx="1018" cy="272" r="4" fill="#c0392b"/>
    <!-- back friend face -->
    <text x="640" y="208" text-anchor="middle" font-size="20" fill="#33302b">!!</text>
    <!-- front friend face -->
    <circle cx="444" cy="466" r="5" fill="#fbfaf6" stroke="#33302b" stroke-width="1.5"/>
    <circle cx="460" cy="466" r="5" fill="#fbfaf6" stroke="#33302b" stroke-width="1.5"/>
    <circle cx="444" cy="467" r="2" fill="#111"/>
    <circle cx="460" cy="467" r="2" fill="#111"/>
    <ellipse cx="452" cy="480" rx="5" ry="7" fill="#5a2a22"/>
    <!-- sweat drop -->
    <path d="M478,452 q6,10 0,16 q-6,-6 0,-16 z" fill="#6fb7d8" stroke="#33302b" stroke-width="1.2"/>

    <!-- speech text -->
    <text x="240" y="238" text-anchor="middle" font-size="24" fill="#33302b">這局超順的啊～ XD</text>
    <text x="915" y="158" text-anchor="middle" font-size="24" fill="#c0392b" font-weight="bold">嘿嘿…其實我是叛徒～</text>

    <!-- shout near front friend -->
    <text x="392" y="446" text-anchor="middle" font-size="30" fill="#c0392b" font-weight="bold" transform="rotate(-8 392 446)">蛤!?</text>
    <!-- 登登登 near notes -->
    <text x="548" y="300" text-anchor="middle" font-size="22" fill="#33302b">登 登 登～</text>

    <!-- traitor tag -->
    <g transform="rotate(-6 1120 470)">
      <rect x="1050" y="452" width="118" height="34" rx="6" fill="#c0392b"/>
      <text x="1109" y="475" text-anchor="middle" font-size="19" fill="#fbfaf6" font-weight="bold">叛徒 TRAITOR</text>
    </g>
    <path d="M1090,452 q-20,-10 -46,-30" stroke="#33302b" stroke-width="2.5" fill="none" marker-end="none"/>

    <!-- sound-board label -->
    <text x="410" y="440" text-anchor="middle" font-size="13" fill="#7a6a4a">↑ 音效板</text>

    <!-- top-left diary tag -->
    <g transform="rotate(-3 150 50)">
      <rect x="44" y="30" width="214" height="40" rx="9" fill="#f0c04a" stroke="#33302b" stroke-width="2.5"/>
      <text x="151" y="57" text-anchor="middle" font-size="22" fill="#33302b" font-weight="bold">圖畫日記 · pic diary</text>
    </g>
    <!-- date top-right -->
    <text x="1120" y="52" text-anchor="end" font-size="20" fill="#7a6a4a" transform="rotate(-4 1120 52)">2026 · 08</text>

    <!-- subtitle line -->
    <text x="600" y="540" text-anchor="middle" font-size="21" fill="#5a5348">然後，整桌的空氣就變了…（音效板：登 登 登～）</text>
  </g>

  <!-- ============ BOTTOM CAPTION RIBBON ============ -->
  <g filter="url(#rough2)">
    <rect x="70" y="560" width="1060" height="52" rx="12" fill="#33302b"/>
  </g>
  <g>
    <text x="600" y="588" text-anchor="middle" font-size="27" fill="#f4ecd8" font-weight="bold">叛徒翻面的那一刻</text>
    <text x="600" y="606" text-anchor="middle" font-size="15" fill="#e6d0a3" font-style="italic">— the moment of Betrayal —　games.csiesheep.com/betrayal_sound_board</text>
    <text x="1112" y="628" text-anchor="end" font-size="13" fill="#8a8272">— 小羊 · csiesheep</text>
  </g>
</svg>
